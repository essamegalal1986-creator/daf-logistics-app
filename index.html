<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAF Logistics App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F9; --surface:#FFFFFF; --sunk:#F7F8FC; --ink:#1B2038; --muted:#5A6180; --line:#DCDFEC;
  --route:#2B3A8F; --route-ink:#FFFFFF; --route-soft:#E6E9F6;
  --tag:#2B3A8F; --tag-ink:#FFFFFF;
  --navy:#2B3A8F; --navy-deep:#222E73; --on-navy:#FFFFFF; --on-navy-muted:rgba(255,255,255,.72);
  --ok:#1C7348; --ok-soft:#DFF1E6; --warn:#955A00; --warn-soft:#FBEBCF; --bad:#B0281F; --bad-soft:#F9E1DE; --info-soft:#E6E9F0;
  --body:'Mulish', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cond:'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141C; --surface:#1B1E2A; --sunk:#161923; --ink:#E7E9F2; --muted:#9CA2BD; --line:#2C3145;
    --route:#9AA8F0; --route-ink:#12162C; --route-soft:#252C4F; --tag:#3C4DB0; --tag-ink:#FFFFFF; --navy:#27347F; --navy-deep:#1D2766;
    --ok:#6CCB97; --ok-soft:#173226; --warn:#E9B25A; --warn-soft:#352A14; --bad:#F08A80; --bad-soft:#3A1D1B; --info-soft:#232B35;
  }
}
:root[data-theme="dark"]{
  --paper:#12141C; --surface:#1B1E2A; --sunk:#161923; --ink:#E7E9F2; --muted:#9CA2BD; --line:#2C3145;
    --route:#9AA8F0; --route-ink:#12162C; --route-soft:#252C4F; --tag:#3C4DB0; --tag-ink:#FFFFFF; --navy:#27347F; --navy-deep:#1D2766;
  --ok:#6CCB97; --ok-soft:#173226; --warn:#E9B25A; --warn-soft:#352A14; --bad:#F08A80; --bad-soft:#3A1D1B; --info-soft:#232B35;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.005em}
h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}

/* Shell */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--navy);color:var(--on-navy);border-bottom:1px solid var(--navy-deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{font-family:var(--cond);font-weight:300;font-size:19px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:12px;color:var(--on-navy)}
.brand b{font-weight:600}
.logo{display:inline-grid;place-items:center;background:var(--navy);color:#fff;border-radius:22%;font-family:var(--cond);font-weight:400;letter-spacing:.04em;line-height:1;flex:none}
.logo span{transform:scaleX(1.18);display:inline-block}
.top .logo{width:38px;height:38px;font-size:13px;background:#fff;color:var(--navy)}
.brand .rule{width:1.5px;height:28px;background:rgba(255,255,255,.55)}
.top select{min-width:220px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.top select option{color:#1B2038;background:#fff}
.top .muted{color:var(--on-navy-muted)}
.top .btn.plain{border-color:rgba(255,255,255,.5);color:#fff}
.top .btn.plain:hover{background:rgba(255,255,255,.12)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who strong{display:block;line-height:1.2}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{padding:18px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;font-size:15px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:500}
.nav-i:hover{background:var(--sunk)}
.nav-i.on{background:var(--route-soft);color:var(--route);box-shadow:inset 3px 0 0 var(--route);font-weight:700}
.nav-n{font-family:var(--cond);font-weight:600;width:20px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-i.on .nav-n{color:var(--route)}
.nav-c{margin-left:auto;background:var(--route);color:var(--route-ink);font-size:12px;font-weight:600;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.main{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;background:var(--surface)}
  .nav-i{white-space:nowrap;flex:none}
  .top select{min-width:0;flex:1}
  .brand{font-size:21px}
}

/* Page header: step numeral is the type moment */
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.ph-n{font-family:var(--cond);font-weight:700;font-size:64px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--route);font-variant-numeric:tabular-nums}
.ph h1{font-size:26px;font-weight:600}
.ph{border-left:3px solid var(--navy);padding-left:14px}
.ph p{color:var(--muted);max-width:68ch;margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.panel > h2{margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);font-size:15px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{min-height:60px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0}
legend{font-size:13px;color:var(--muted);padding:0 4px}
.btn{border:1px solid var(--route);background:var(--route);color:var(--route-ink);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--route)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--route);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
tr.expanded td{background:var(--sunk)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* Reference tag: the one thread through the whole app */
.ref{display:inline-block;position:relative;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.02em;background:var(--tag);color:var(--tag-ink);padding:0 9px 0 16px;line-height:22px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);white-space:nowrap;border:0;cursor:default;font-variant-numeric:tabular-nums}
.ref::before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
button.ref{cursor:pointer}
button.ref:hover{filter:brightness(.95)}
.ref.lg{font-size:20px;line-height:34px;padding:0 14px 0 24px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.ref.lg::before{left:10px;width:7px;height:7px;margin-top:-3.5px}
.code{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--info-soft);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{color:var(--route);background:var(--route-soft)}
.st-prepared,.st-awaiting-route,.st-planned{color:var(--warn);background:var(--warn-soft)}
.st-routed,.st-in-transit,.st-in-progress{color:var(--route);background:var(--route-soft)}
.st-completed,.st-recorded,.st-done,.st-active{color:var(--ok);background:var(--ok-soft)}
.st-counted{color:var(--warn);background:var(--warn-soft)}
.st-reallocated,.st-partly-reallocated{color:var(--ok);background:var(--ok-soft)}
.st-waiting-for-stock{color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn)}
.st-returned-to-stock{color:var(--muted);background:var(--info-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--route);color:var(--route-ink)}
.st-failed,.st-inactive{color:var(--bad);background:var(--bad-soft)}
.ty{font-size:13px;font-weight:600;color:var(--muted)}

/* Stats and chain */
.ccard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.ccard span{display:block}
.rmap-day{margin-bottom:18px}
.rmap-day:last-child{margin-bottom:0}
.rmap-day > h3{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rmap-route{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface)}
.rmap-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk);border-radius:10px 10px 0 0}
.rmap-head .who-a{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-size:12px;font-weight:600;flex:none}
.rmap-prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rmap-prog .abar{min-width:90px;width:120px}
.metro-scroll{overflow-x:auto;padding:16px 8px 12px}
.metro{display:flex;list-style:none;margin:0;padding:0;min-width:max-content}
.mnode{position:relative;width:150px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:none}
.mnode::before{content:"";position:absolute;top:15px;right:50%;width:100%;height:4px;background:var(--line);z-index:0}
.mnode:first-child::before{display:none}
.mnode.trav::before{background:var(--route)}
.mdot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:3px solid var(--route);background:var(--surface);color:var(--route);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:13px}
.mnode.s-completed .mdot{background:var(--ok);border-color:var(--ok);color:#fff}
.mnode.s-failed .mdot{background:var(--bad);border-color:var(--bad);color:#fff}
.mnode.s-in-transit .mdot{background:var(--route-soft);box-shadow:0 0 0 4px var(--route-soft)}
.mnode.endpt .mdot{border-radius:8px;background:var(--navy);border-color:var(--navy);color:#fff;font-size:11px}
.mnode.finish:not(.done) .mdot{background:var(--surface);color:var(--route);border-style:dashed}
.mlbl{margin-top:8px;padding:0 6px;font-size:13px;line-height:1.35;display:flex;flex-direction:column;align-items:center;gap:3px}
.mlbl strong{font-size:13px;font-weight:700;max-width:138px;overflow-wrap:anywhere}
.mlbl .muted{font-size:12px}
.mlbl .ref{font-size:11px;line-height:18px}
@media (prefers-reduced-motion:no-preference){.mnode.s-in-transit .mdot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}}
.sc-prod td{background:var(--sunk)}
.ptag{display:inline-block;font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--route);background:var(--route-soft);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--bad)}
.modal h2{margin-bottom:8px}
.modal ul{margin:8px 0 12px 18px;padding:0;font-size:14px}
.soline{display:grid;grid-template-columns:120px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr) 90px 110px auto;gap:8px;align-items:start}
@media (max-width:760px){.soline{grid-template-columns:1fr 1fr}}
.pick table{font-size:14px}
.pick tfoot td{border-top:1px solid var(--line);background:var(--sunk)}
.stop .pick{max-width:640px}
.loadlist{border-bottom:1px solid var(--line);padding:10px 16px;background:var(--surface)}
.loadlist summary{cursor:pointer;color:var(--route)}
.reqnote{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;padding:6px 10px;margin:6px 0;font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.reqnote.compact{font-size:13px;padding:3px 8px;margin:4px 0 0}
.abar{display:flex;height:10px;min-width:120px;border-radius:999px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.abar i{display:block;height:100%}
.b-done{background:var(--ok)} .b-pend{background:var(--warn)} .b-fail{background:var(--bad)}
.lg-k{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--cond);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chain{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
.ch{display:flex;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.ch i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:inline-block;margin-right:5px;flex:none}
.ch.done i{background:var(--route);border-color:var(--route)}
.ch.done{color:var(--ink)}
.ch.fail i{background:var(--bad);border-color:var(--bad)}
.ch + .ch::before{content:"";width:16px;height:2px;background:var(--line);margin:0 6px}
.ch.done + .ch.done::before{background:var(--route)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--route);border-bottom-color:var(--route)}

.note{background:var(--sunk);border-left:3px solid var(--tag);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.err{color:var(--bad);font-size:14px}
.pbline{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:640px){.pbline{grid-template-columns:1fr 1fr}}
.line{display:grid;grid-template-columns:130px minmax(0,1.5fr) minmax(0,1.2fr) 100px auto;gap:8px;align-items:start}
.line label{min-height:100%}
.line .btn{margin-top:22px}
.bhint{min-height:18px;font-weight:400}
.bhint.okh{color:var(--ok)}
.bhint.bad{color:var(--bad)}
@media (max-width:640px){.line{grid-template-columns:1fr 1fr}}
.hide{display:none!important}

/* Routes / stops */
.route{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px;overflow:hidden}
.route-h{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--sunk)}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px dashed var(--line)}
.stop:last-child{border-bottom:0}
.stop-n{width:30px;height:30px;border-radius:50%;border:2px solid var(--route);color:var(--route);display:grid;place-items:center;font-family:var(--cond);font-weight:700}
.stop.is-done .stop-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stop.is-failed .stop-n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.items{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.items li{padding:2px 0}

/* Trace */
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 18px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--route)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:13px;color:var(--muted)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.lockup{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.lockup .logo{width:86px;height:86px;font-size:27px}
.lockup .rule{width:2px;align-self:stretch;background:var(--navy);opacity:.85}
.lockup .words{font-family:var(--cond);font-weight:300;color:var(--route);font-size:19px;line-height:1.25;letter-spacing:.03em}
.lockup .words b{font-weight:400;font-size:26px;line-height:1}
.app-name{font-family:var(--cond);font-weight:300;font-size:24px;letter-spacing:.01em;margin-bottom:4px}
.app-name b{font-weight:600;color:var(--route)}
.login{background:linear-gradient(180deg,var(--navy) 0,var(--navy) 38%,var(--paper) 38%)}
.demo{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.demo-row{display:flex;justify-content:space-between;gap:10px;border:0;background:var(--sunk);border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;font-size:14px}
.demo-row span{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:500;max-width:min(560px,90vw);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:var(--route-soft);color:var(--route);padding:8px 14px;border-radius:8px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .2s ease-out}@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div id="app"></div>

async function hashPw(username,pw){
  const txt='waybill|'+username.toLowerCase()+'|'+pw;
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ let h=2166136261; for(const c of txt){h^=c.charCodeAt(0);h=Math.imul(h,16777619)} return 'f'+(h>>>0).toString(16); }
}

/* ---------- Domain ---------- */
const find=(list,id)=>list.find(x=>x.id===id);
const nm=(list,id,fb='')=>(find(list,id)||{}).name||fb;
function cur(){const u=me();return u?u.username:'system'}
function me(){return session&&state?state.users.find(u=>u.id===session.uid&&u.active):null}
function qty(s,loc,pid,bid){return s.stock[loc+'|'+pid+'|'+(bid||'')]||0}
function adj(s,loc,pid,bid,d){const k=loc+'|'+pid+'|'+(bid||'');s.stock[k]=(s.stock[k]||0)+d}
function locTotal(s,loc){let t=0;for(const k in s.stock)if(k.startsWith(loc+'|'))t+=s.stock[k];return t}
function batchNo(s,bid){const b=find(s.batches||[],bid);return b?b.batchNo:''}
/* Units of a batch across the current project's warehouses */
/* Stock of a batch across the project's warehouses and sales team */
function batchAvail(s,bid){const b=find(s.batches,bid);if(!b)return 0;return projLocs(s,b.projectId).reduce((a,l)=>a+qty(s,l[0],b.productId,bid),0)}
function projLocs(s,pid,strict){const ok=x=>x.projectId===pid||(!strict&&x.projectId==='__all');return [...s.warehouses.filter(ok).map(w=>['W:'+w.id,w.name,'w']),...s.salesTeam.filter(ok).map(x=>['S:'+x.id,x.name,'s'])]}
function itemLoc(it){return it.loc||(it.warehouseId?'W:'+it.warehouseId:'')}
function batchesFor(s,pid){return s.batches.filter(b=>b.productId===pid).slice().sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'))}
/* Which batches a request line may use: stock-out types need stock on hand, stock-in types may use any batch of the product */
/* Batches a request line may use, for the searchable batch field */
function allowedBatches(s,pid,type){const need=false;return batchesFor(s,pid).filter(b=>!need||batchAvail(s,b.id)>0)}
function batchLabel(s,b){return `${batchAvail(s,b.id)} available${b.expiry?', exp '+fmtD(b.expiry):''}`}
function findBatch(s,pid,text){const t=String(text||'').trim().toUpperCase();return t?batchesFor(s,pid).find(b=>b.batchNo.toUpperCase()===t):null}
let dlSeq=0;
function setupBatchField(line,type){
  const p=line.querySelector('select[name=item_product]'),inp=line.querySelector('input[name=item_batch]'),dl=line.querySelector('datalist');
  if(!dl.id){dl.id='bl_'+(++dlSeq);inp.setAttribute('list',dl.id)}
  if(!p.value){inp.value='';inp.disabled=true;inp.placeholder='Choose product first';dl.innerHTML='';batchHint(line,type);return}
  const list=allowedBatches(state,p.value,type);
  dl.innerHTML=list.map(b=>`<option value="${esc(b.batchNo)}">${esc(batchLabel(state,b))}</option>`).join('');
  inp.disabled=!list.length;
  const need=['out','move'].includes((TYPES[type]||{}).flow);
  inp.placeholder=list.length?`Type to find, ${list.length} batch${list.length>1?'es':''}`:(need?'No batch with stock':'No batches for this product');
  if(inp.value&&!list.some(b=>b.batchNo.toUpperCase()===inp.value.trim().toUpperCase()))inp.value='';
  if(!inp.value&&list.length===1)inp.value=list[0].batchNo;
  batchHint(line,type);
}
function batchHint(line,type){
  const p=line.querySelector('select[name=item_product]'),inp=line.querySelector('input[name=item_batch]'),h=line.querySelector('.bhint');
  h.className='bhint small';
  if(!p.value){h.textContent='';return}
  const list=allowedBatches(state,p.value,type);const t=inp.value.trim().toUpperCase();
  if(!t){h.classList.add('muted');h.textContent=list.length?'Earliest expiry: '+list[0].batchNo:'';return}
  const exact=list.find(b=>b.batchNo.toUpperCase()===t);
  if(exact){h.classList.add('okh');h.textContent=batchLabel(state,exact);return}
  const m=list.filter(b=>b.batchNo.toUpperCase().includes(t));
  if(m.length){h.classList.add('muted');h.textContent=m.length+' match'+(m.length>1?'es':'')+': '+m.slice(0,3).map(b=>b.batchNo).join(', ')+(m.length>3?'…':'')}
  else{h.classList.add('bad');h.textContent='No matching batch for this product'}
}
function batchOptions(s,pid,type,sel){
  if(!pid)return '<option value="">Choose product first</option>';
  const flow=(TYPES[type]||{}).flow;const needStock=flow==='out'||flow==='move';
  const list=batchesFor(s,pid).filter(b=>!needStock||batchAvail(s,b.id)>0||b.id===sel);
  if(!list.length)return `<option value="">${needStock?'No batch with stock':'No batches, add one on Products'}</option>`;
  return '<option value="">Choose batch</option>'+list.map(b=>`<option value="${esc(b.id)}" ${b.id===sel?'selected':''}>${esc(b.batchNo)}, ${batchAvail(s,b.id)} available${b.expiry?', exp '+esc(fmtD(b.expiry)):''}</option>`).join('');
}
function migrate(s){
  if(!s)return s;
  if(s.v===1){
    s.batches=s.batches||[];
    const legacy={};
    const lb=pid=>{if(legacy[pid])return legacy[pid];const p=find(s.products,pid)||{};const id='bt_legacy_'+pid;s.batches.push({id,projectId:p.projectId,productId:pid,batchNo:(p.sku||'ITEM')+'-OPENING',mfg:'',expiry:'',createdAt:now(),createdBy:'system'});return legacy[pid]=id};
    const ns={};for(const k in s.stock){const [l,pid]=k.split('|');ns[l+'|'+pid+'|'+lb(pid)]=s.stock[k]}s.stock=ns;
    s.movements.forEach(m=>{if(!m.batchId)m.batchId=lb(m.productId)});
    s.requests.forEach(r=>r.items.forEach(it=>{if(!it.batchId)it.batchId=lb(it.productId)}));
    s.sales.forEach(x=>x.lines.forEach(l=>{if(!l.batchId)l.batchId=lb(l.productId)}));
    s.v=2;
  }
  (s.tasks||[]).forEach(t=>{if(t.status==='Assigned')t.status='Awaiting route'});
  (s.projects||[]).forEach(pj=>{const cs=(s.customers||[]).filter(c=>c.projectId===pj.id);let n=0;cs.forEach(c=>{if(!c.code){do{n++}while(cs.some(x=>x.code==='C'+pad(n,4)));c.code='C'+pad(n,4)}})});
  (s.projects||[]).forEach(pj=>{const ps=(s.products||[]).filter(p=>p.projectId===pj.id);let n=0;ps.forEach(p=>{if(!p.code){do{n++}while(ps.some(x=>x.code==='P'+pad(n,4)));p.code='P'+pad(n,4)}})});
  (s.products||[]).forEach(p=>{if(!p.code)p.code='P-'+p.id.slice(-5).toUpperCase()});
  if(!s.govs)s.govs=seedGovs();
  if(!s.routeGroups)s.routeGroups=[];
  if(!s.counts)s.counts=[];
  if(!s.hasStockCheckPage){(s.users||[]).forEach(u=>{if((u.role==='admin'||u.role==='lead')&&u.pages&&!u.pages.includes('stockcheck'))u.pages.push('stockcheck')});s.hasStockCheckPage=true}
  if(!s.sharedGroups){const keep={};const remap={};
    s.routeGroups.forEach(g=>{const k=g.name.trim().toLowerCase();if(keep[k]){keep[k].govIds=[...new Set([...keep[k].govIds,...g.govIds])];remap[g.id]=keep[k].id}else{keep[k]=g}});
    s.routeGroups=Object.values(keep);s.routeGroups.forEach(g=>delete g.projectId);
    (s.routes||[]).forEach(r=>{if(remap[r.groupId])r.groupId=remap[r.groupId]});s.sharedGroups=true}
  return s;
}
const isLoc=l=>/^[WS]:/.test(l||'');
function locName(s,l){
  if(!l)return '';const [k,id]=[l.slice(0,1),l.slice(2)];
  if(k==='W')return nm(s.warehouses,id,'')||((s.archive||{})[l]?s.archive[l]+' (deleted)':'Warehouse');
  if(k==='S')return (nm(s.salesTeam,id,'')||((s.archive||{})[l]?s.archive[l]+' (deleted)':'Sales agent'))+' (sales agent)';
  if(k==='C')return (custLabel(find(s.customers,id))||'Customer')+' (customer)';
  if(k==='X')return id;
  return l;
}
function move(s,m,by){
  if(isLoc(m.from))adj(s,m.from,m.productId,m.batchId,-m.qty);
  if(isLoc(m.to))adj(s,m.to,m.productId,m.batchId,m.qty);
  s.movements.push({id:'MOV-'+pad(++s.seq.mov,5),at:now(),by:by||cur(),...m});
}
function log(s,action,ref,detail,status,by,projectId){
  s.log.push({id:'LOG-'+pad(++s.seq.log,5),at:now(),by:by||cur(),projectId:projectId===undefined?((ref&&(s.requests.find(r=>r.ref===ref)||s.counts&&s.counts.find(c=>c.id===ref)||s.sales.find(x=>x.ref===ref)||{}).projectId)||(isAll()?null:ui.project)):projectId,action,ref:ref||'',detail:detail||'',status:status||''});
}

/* Stock still missing for an open delivery/transfer: list of {loc,pid,bid,have,need} */
function stockShort(s,r){
  const f=(TYPES[r.type]||{}).flow;if((f!=='out'&&f!=='move')||['Completed','Returned to stock'].includes(r.status))return [];
  const need={};r.items.forEach(it=>{const loc=itemLoc(it);const k=(loc||'*')+'|'+it.productId+'|'+(it.batchId||'');need[k]=(need[k]||0)+Number(it.qty)});
  const out=[];for(const k in need){const [loc,pid,bid]=k.split('|');const have=loc==='*'?batchAvail(s,bid):qty(s,loc,pid,bid);if(have<need[k])out.push({loc:loc==='*'?'':loc,pid,bid,have,need:need[k]})}
  return out;
}
function waitBadge(r){const sh=stockShort(state,r);if(!sh.length)return '';return ` <span class="st st-waiting-for-stock" title="${esc(sh.map(x=>(x.loc?locName(state,x.loc)+': ':'')+x.have+' of '+x.need+' '+nm(state.products,x.pid)+' ('+batchNo(state,x.bid)+')').join('; '))}">Waiting for stock</span>`}
function checkStock(s,r){
  const need={};
  r.items.forEach(it=>{const k=itemLoc(it)+'|'+it.productId+'|'+(it.batchId||'');need[k]=(need[k]||0)+Number(it.qty)});
  for(const k in need){
    const [loc,pid,bid]=k.split('|');const have=qty(s,loc,pid,bid);
    if(have<need[k])throw new Error('Cannot complete yet, waiting for stock. '+`${locName(s,loc)} has ${have} of ${nm(s.products,pid)}, batch ${batchNo(s,bid)}. This request needs ${need[k]}.`);
  }

/* ---------- File download (claude.ai runtime or plain browser) ---------- */
async function saveFile(filename,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename,data})}catch(e){if(e&&e.code!=='declined')toast('Could not save the file: '+(e.message||e.code),'bad')}return}
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||(filename.endsWith('.json')?'application/json':filename.endsWith('.csv')?'text/csv':'application/octet-stream')});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){toast('Could not save the file.','bad')}
}

/* ---------- Firebase (online shared database) ---------- */
let FB=null;
const FB_CHUNK=400000;
function fbEmail(u){return String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]+/g,'_')+'@'+EMAIL_DOMAIN}
function fbDoc(c,d){return FB.db.collection(c).doc(d)}
function fbErr(e){const c=(e&&e.code)||'';
  if(/permission-denied/.test(c))return 'The database refused this action. Check that the Firestore rules are published and that your account is active.';
  if(/unavailable|network/.test(c))return 'No connection to the database. Check your internet and try again.';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'Username or password is incorrect.';
  if(/too-many-requests/.test(c))return 'Too many attempts. Wait a few minutes and try again.';
  if(/email-already-in-use/.test(c))return 'A login with this username already exists.';
  if(/weak-password/.test(c))return 'The password must be at least 6 characters.';
  if(/requires-recent-login/.test(c))return 'For security, sign out, sign in again, then change the password.';
  if(/operation-not-allowed/.test(c))return 'Email/Password sign-in is not enabled in Firebase Authentication.';
  if(/unauthorized-domain/.test(c))return 'This website address is not in Firebase Authentication, Authorized domains.';
  return (e&&e.message)||String(e)}
function fbSplit(str){const parts=[];let i=0;while(i<str.length){let j=Math.min(str.length,i+FB_CHUNK);if(j<str.length){const c=str.charCodeAt(j-1);if(c>=0xD800&&c<=0xDBFF)j--}parts.push(str.slice(i,j));i=j}return parts.length?parts:['']}
function fbWrite(w,st,oldN){
  const parts=fbSplit(JSON.stringify(st));
  parts.forEach((d,i)=>w.set(fbDoc('state','c'+i),{d}));
  for(let i=parts.length;i<(oldN||0);i++)w.delete(fbDoc('state','c'+i));
  w.set(fbDoc('state','head'),{rev:st.rev,n:parts.length,by:(me()||{}).username||'setup',at:new Date().toISOString()});
}
async function fbReadTx(tx){
  const h=await tx.get(fbDoc('state','head'));if(!h.exists)return {rev:0,n:0,state:null};
  const d=h.data();let str='';for(let i=0;i<d.n;i++){const c=await tx.get(fbDoc('state','c'+i));str+=((c.exists&&c.data())||{}).d||''}
  return {rev:d.rev||0,n:d.n||0,state:str?JSON.parse(str):null};
}
async function fbAct(fn,okMsg){
  try{
    let out=null;
    await FB.db.runTransaction(async tx=>{
      const h=await tx.get(fbDoc('state','head'));const hd=h.exists?h.data():{rev:0,n:0};
      let base=state;
      if((hd.rev||0)!==(state.rev||0)){let str='';for(let i=0;i<hd.n;i++){const c=await tx.get(fbDoc('state','c'+i));str+=((c.exists&&c.data())||{}).d||''}base=migrate(str?JSON.parse(str):blank())}
      const st=structuredClone(base);fn(st);st.rev=(hd.rev||0)+1;fbWrite(tx,st,hd.n);out=st;
    });
    state=out;render();
    const m=okMsg||toastMsg;toastMsg='';if(m)toast(m);
    return true;
  }catch(e){toastMsg='';toast(fbErr(e),'bad');return false}
}
async function fbReplace(st){
  let out=null;
  await FB.db.runTransaction(async tx=>{const h=await tx.get(fbDoc('state','head'));const hd=h.exists?h.data():{rev:0,n:0};st.rev=(hd.rev||0)+1;fbWrite(tx,st,hd.n);out=st});
  state=out;render();
}
function fbSyncAccess(u){if(!FB||!u||!u.fbUid)return Promise.resolve();return fbDoc('access',u.fbUid).set({username:u.username,role:u.role,active:!!u.active},{merge:true}).catch(e=>toast(fbErr(e),'bad'))}
async function fbCreateLogin(username,password){
  FB.secondary=FB.secondary||firebase.initializeApp(FIREBASE_CONFIG,'secondary');
  const a2=FB.secondary.auth();const cred=await a2.createUserWithEmailAndPassword(fbEmail(username),password);const uid=cred.user.uid;await a2.signOut();return uid;
}

function fbBoot(){
  FB={loaded:false,denied:false,needSetup:false};
  FB.app=firebase.initializeApp(FIREBASE_CONFIG);FB.auth=firebase.auth();FB.db=firebase.firestore();
  state=migrate(blank());render();
  FB.auth.onAuthStateChanged(async user=>{
    if(FB.unsub){FB.unsub();FB.unsub=null}
    FB.user=user;FB.loaded=false;FB.denied=false;session=null;
    if(!user){
      state=migrate(blank());
      try{const m=await fbDoc('meta','setup').get();FB.needSetup=!m.exists}catch(e){FB.needSetup=false}
      render();return;
    }
    render();
    FB.unsub=fbDoc('state','head').onSnapshot(async snap=>{
      try{
        if(!snap.exists){if(!FB.loaded){state=migrate(blank());render()}return}
        const d=snap.data();if(FB.loaded&&state&&d.rev===state.rev)return;
        const r=await FB.db.runTransaction(tx=>fbReadTx(tx));
        state=migrate(r.state||blank());state.rev=r.rev;
        const first=!FB.loaded;FB.loaded=true;
        const u=state.users.find(x=>x.fbUid===user.uid);session=u?{uid:u.id}:null;
        if(first){ui.page=null;ui.project=null;render();if(me())fbAct(st=>log(st,'Signed in',null,me().name+', '+ROLES[me().role],'',me().username,null))}
        else softRender();
      }catch(e){toast(fbErr(e),'bad')}
    },err=>{FB.denied=true;FB.loaded=true;render()});
  });
}

/* ---------- Persistence ---------- */
function persist(){
  if(FB)return;
  lastJson=JSON.stringify(state);
  try{localStorage.setItem(LS_KEY,lastJson)}catch(e){}
  if(docRef){docRef.set({json:lastJson,rev:state.rev}).catch(e=>toast('Could not save to shared storage: '+(e.message||e.code),'bad'))}
}
function act(fn,okMsg){
  if(FB&&FB.user)return fbAct(fn,okMsg);
  try{
    const s=structuredClone(state);
    fn(s);
    s.rev++;state=s;persist();render();
    if(okMsg)toast(okMsg);
  }catch(e){toast(e.message||String(e),'bad');}
}
function softRender(){
  const a=document.activeElement;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest('.main')){ui.pending=true;const b=document.getElementById('pending');if(b)b.classList.remove('hide');return}
  ui.pending=false;render();
}
let toastTimer=null;
function toast(msg,kind){const t=document.getElementById('toast');t.innerHTML=`<div class="toast ${kind||''}" role="status">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.innerHTML='',kind==='bad'?5200:2800)}

/* ---------- Access ---------- */
function allowedPages(u){return PAGES.map(p=>p[0]).filter(p=>(u.pages||[]).includes(p))}
function myProjects(u){return (u.role==='admin'||(u.projects||[]).includes('__all'))?state.projects:state.projects.filter(p=>(u.projects||[]).includes(p.id))}
const ALL='__all';
const isAll=()=>ui.project===ALL;
const AG=()=>P(state.agents).filter(a=>!a.deleted);
const isAdmin=()=>{const u=me();return !!u&&u.role==='admin'};
function delBtn(kind,id){return isAdmin()?`<button class="btn bad sm" data-act="askDelete" data-kind="${kind}" data-id="${esc(id)}">Delete</button>`:''}
function myProjIds(){const u=me();return u?myProjects(u).map(p=>p.id):[]}
const P0=list=>{if(isAll()){const ids=myProjIds();return list.filter(x=>x.projectId===ALL||ids.includes(x.projectId))}return list.filter(x=>x.projectId===ui.project||x.projectId===ALL)};
/* Users limited to "own records" only see what they created or what is assigned to them */
function scopeOwn(){const u=me();return !!u&&u.scope==='own'&&u.role!=='admin'}
function visReq(r){const u=me();if(!u||!r)return false;if(r.createdBy===u.username)return true;const t=taskOf(state,r.ref);return !!(t&&t.agentId&&myAgentIds(u).includes(t.agentId))}
function visTask(t){const r=find(state.requests,t.requestId);return visReq(r)}
function visRoute(rt){const u=me();return rt.createdBy===u.username||myAgentIds(u).includes(rt.agentId)||rt.taskIds.some(id=>{const t=find(state.tasks,id);return t&&visTask(t)})}
function ownTrip(rt){const u=me();return !scopeOwn()||rt.createdBy===u.username||myAgentIds(u).includes(rt.agentId)}
function visSale(x){const u=me();if(x.recordedBy===u.username)return true;const r=state.requests.find(y=>y.ref===x.ref);return !!r&&visReq(r)}
function visRef(ref){if(!ref)return false;const r=state.requests.find(y=>y.ref===ref);if(r)return visReq(r);const sl=state.sales.find(y=>y.ref===ref);if(sl)return visSale(sl);const c=(state.counts||[]).find(y=>y.id===ref);return !!c&&c.by===me().username}
function visMov(m){return m.by===me().username||visRef(m.ref)}
function visLog(l){return l.by===me().username||visRef(l.ref)}
const P=list=>{const out=P0(list);if(!state||!scopeOwn())return out;
  if(list===state.requests)return out.filter(visReq);if(list===state.tasks)return out.filter(visTask);if(list===state.routes)return out.filter(visRoute);
  if(list===state.sales)return out.filter(visSale);if(list===state.movements)return out.filter(visMov);if(list===state.counts)return out.filter(c=>c.by===me().username);return out};
function projCode(pid){return pid===ALL?'ALL':(find(state.projects,pid)||{}).code||''}
function projTag(pid){return isAll()?`<span class="ptag">${esc(projCode(pid))}</span>`:''}
function allGate(what){const projs=myProjects(me());return `<div class="panel"><p style="margin-bottom:10px">You are viewing <strong>all projects</strong>. To ${esc(what)}, choose the project first:</p><div class="row">${projs.map(p=>`<button class="btn ghost sm" data-act="pickProject" data-id="${p.id}">${esc(p.code)}: ${esc(p.name)}</button>`).join('')}</div></div>`}
function myAgentIds(u){return state.agents.filter(a=>a.userId===u.id).map(a=>a.id)}

/* ---------- Render ---------- */
function render(){
  const root=document.getElementById('app');
  if(!state){root.innerHTML='<div class="login"><p class="muted">Loading…</p></div>';return}
  const u=me();
  if(!u){root.innerHTML=FB?(FB.user?noAccessView():(FB.needSetup?setupView():loginView())):((LIVE_MODE&&!state.users.length)?setupView():loginView());return}
  if(u.mustChange){root.innerHTML=changePwView(u);return}
  const pages=allowedPages(u);
  if(!pages.length){root.innerHTML=`<div class="login"><div class="login-card"><h2>No pages assigned</h2><p class="muted" style="margin:8px 0 16px">Your account has no pages yet. Ask the administrator to grant access.</p><button class="btn" data-act="logout">Sign out</button></div></div>`;return}
  if(!pages.includes(ui.page))ui.page=(LIVE_MODE&&!state.projects.length&&pages.includes('projects'))?'projects':pages[0];
  const projs=myProjects(u);
  const allOk=projs.length>1;if(!(ui.project===ALL&&allOk)&&!projs.find(p=>p.id===ui.project)){let last=null;try{last=localStorage.getItem('waybill-lastproj-'+u.id)}catch(e){}ui.project=(last===ALL&&allOk)?ALL:projs.find(p=>p.id===last)?last:allOk?ALL:(projs[0]?projs[0].id:null)}
  try{if(ui.project)localStorage.setItem('waybill-lastproj-'+u.id,ui.project)}catch(e){}
  root.innerHTML=shell(u,pages,projs);
  if(ui.page==='requests'&&ui.editReq)fillReqEdit();
}

function navCount(page,u){
  if(!ui.project)return 0;
  if(page==='prepare')return P(state.requests).filter(r=>r.status==='New'||r.status==='Failed').length;
  if(page==='routes')return P(state.tasks).filter(t=>t.status==='Awaiting route').length;

}

const IMP_COLS=[['code','Product ID',['product id','productid','id','product code','item id']],['sku','SKU',['sku','item code']],['name','Product name',['product name','name','product','description']],['unit','Unit',['unit','uom']],['price','Unit price',['unit price','price']],['batchNo','Batch number',['batch number','batch','batch no','lot','lot number']],['mfg','Manufactured',['manufactured','manufacturing date','mfg','production date']],['expiry','Expiry',['expiry','expiry date','exp','expiration','expiration date']]];
function impDate(v){
  if(v===undefined||v===null||v==='')return '';
  if(Object.prototype.toString.call(v)==='[object Date]')return isNaN(v)?null:v.getFullYear()+'-'+pad(v.getMonth()+1,2)+'-'+pad(v.getDate(),2);
  const ok=(y,m,d)=>{const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?y+'-'+pad(m,2)+'-'+pad(d,2):null};

  const t=String(v).trim();let m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return ok(+m[1],+m[2],+m[3]);
  m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(m)return ok(+m[3],+m[2],+m[1]);
  return null;
}
function impParse(rows){
  const hdr=(rows[0]||[]).map(h=>String(h||'').trim().toLowerCase());
  const idx={};IMP_COLS.forEach(([k,,al])=>{idx[k]=hdr.findIndex(h=>al.includes(h))});
  const missing=IMP_COLS.filter(([k])=>['code','sku','name','batchNo'].includes(k)&&idx[k]<0).map(c=>c[1]);
  if(missing.length)return {error:'Missing column'+(missing.length>1?'s':'')+': '+missing.join(', ')+'. Download the template to see the expected columns.'};
  const pid=ui.project;const out=[];const seenNew={};const seenBatch={};
  rows.slice(1).forEach((r,i)=>{
    const g=k=>idx[k]>=0?r[idx[k]]:'';const str=k=>String(g(k)??'').trim();
    if(!r||r.every(c=>String(c??'').trim()===''))return;
    const row={line:i+2,code:str('code').toUpperCase(),sku:str('sku').toUpperCase(),name:str('name'),unit:str('unit')||'unit',price:str('price')===''?0:Number(String(g('price')).replace(/,/g,'')),batchNo:str('batchNo').toUpperCase(),mfg:impDate(g('mfg')),expiry:impDate(g('expiry'))};
    const err=[];if(!row.code)err.push('Product ID missing');if(!row.sku)err.push('SKU missing');if(!row.name)err.push('name missing');if(!row.batchNo)err.push('batch missing');
    if(isNaN(row.price)||row.price<0)err.push('price is not a number');if(row.mfg===null)err.push('manufactured date not understood');if(row.expiry===null)err.push('expiry date not understood');
    if(row.mfg&&row.expiry&&row.expiry<row.mfg)err.push('expiry before manufactured');
    const ex=state.products.find(x=>(x.projectId===pid||x.projectId===ALL)&&(x.code||'').toUpperCase()===row.code);
    if(!err.length){
      if(!ex){const skuClash=state.products.find(x=>x.projectId===pid&&x.sku===row.sku);if(skuClash)err.push('SKU '+row.sku+' already belongs to product '+(skuClash.code||skuClash.name));
        const prev=seenNew[row.code];if(prev&&(prev.sku!==row.sku||prev.name!==row.name))err.push('same Product ID with a different SKU or name on line '+prev.line)}
      else if(ex.sku!==row.sku)err.push('Product ID '+row.code+' exists with SKU '+ex.sku);
    }
    const bkey=row.code+'|'+row.batchNo;
    if(!err.length){
      if(seenBatch[bkey])row.status='dup';
      else if(ex&&state.batches.some(b=>b.productId===ex.id&&b.batchNo===row.batchNo))row.status='exists';

  });
  return {rows:out};
}

  }else{

      <div class="row"><button class="btn" type="submit">Confirm back to stock</button><button type="button" class="btn plain" data-act="expand" data-id="">Close</button></div>
    </form></td></tr>`;
  }

    ${r.type==='Transfer'?`<p style="margin-bottom:8px">Destination: <strong>${esc(locName(state,r.dest))}</strong></p>`:''}

    <div class="fgrid">
      <div class="row"><button class="btn" type="submit">${r.status==='Failed'?'Reassign: try this delivery again':t?'Save and send back to routing':'Save as prepared'}</button><button type="button" class="btn plain" data-act="expand" data-id="">Close</button></div>
    </div></form></td></tr>`;
}

/* Trip serial per project: TRIP-<project code>-0001 */
function tripNo(s,pid,peek){s.seq.trip=s.seq.trip||{};const pj=pid==='__all'?{code:'ALL'}:(find(s.projects,pid)||{});const n=(s.seq.trip[pid]||0)+1;if(!peek)s.seq.trip[pid]=n;return 'TRIP-'+String(pj.code||'X').toUpperCase()+'-'+pad(n,4)}
function routeGovs(rt){return [...new Set(rt.taskIds.map(id=>{const t=find(state.tasks,id);const r=t&&find(state.requests,t.requestId);return r&&r.govId}).filter(Boolean))]}
function routeStatus(rt){const ts=rt.taskIds.map(id=>find(state.tasks,id)).filter(Boolean);if(!ts.length)return 'Planned';if(ts.every(t=>['Completed','Failed'].includes(t.status)))return 'Done';if(ts.some(t=>['In transit','Completed','Failed'].includes(t.status)))return 'In progress';return 'Planned'}

/* Pick list: what to collect (or where to put back) for each product of a request */
function pickHead(r){const f=(TYPES[r.type]||{}).flow;return f==='in'?(r.type==='Received'?'Receive into':'Return to'):f==='none'?'Location':'Collect from'}
function pickTable(r,compact){
  if(!r.items.length)return compact?'':'<p class="muted small">No products on this order.</p>';
  const T=TYPES[r.type]||{};
  const rows=r.items.map(it=>{const b=find(state.batches,it.batchId)||{};const p=find(state.products,it.productId)||{};const loc=itemLoc(it);
    return `<tr><td><strong>${esc(p.name||'?')}</strong><br><span class="muted small">${esc([p.code,p.sku].filter(Boolean).join(' | '))}</span></td><td class="code">${esc(b.batchNo||'')}${!compact&&b.expiry?`<br><span class="muted small" style="font-family:var(--body);font-weight:500">exp ${esc(fmtD(b.expiry))}</span>`:''}</td><td class="num"><strong>${it.qty}</strong>${p.unit&&!compact?` <span class="muted small">${esc(p.unit)}</span>`:''}</td><td>${T.flow==='none'?'<span class="muted">No stock movement</span>':loc?`<strong>${esc(locName(state,loc))}</strong>`:'<span class="muted">Not chosen yet</span>'}</td></tr>`}).join('');
  const tot=r.items.reduce((a,it)=>a+Number(it.qty||0),0);
  return `<div class="tbl pick" style="margin-top:8px"><table><thead><tr><th>Product</th><th>Batch</th><th class="num">Quantity</th><th>${pickHead(r)}</th></tr></thead><tbody>${rows}</tbody>${r.items.length>1?`<tfoot><tr><td colspan="2"><strong>Total</strong></td><td class="num"><strong>${tot}</strong></td><td></td></tr></tfoot>`:''}</table></div>`;
}
/* Loading list for a whole trip: everything to collect, grouped by location */
function loadingList(rt){
  const g={};
  rt.taskIds.map(id=>find(state.tasks,id)).filter(t=>t&&['Routed','In transit'].includes(t.status)).forEach(t=>{const r=find(state.requests,t.requestId);if(!r)return;const f=(TYPES[r.type]||{}).flow;if(f!=='out'&&f!=='move')return;
    r.items.forEach(it=>{const loc=itemLoc(it);const k=loc+'|'+it.productId+'|'+it.batchId;(g[loc]=g[loc]||{});const row=g[loc][k]||(g[loc][k]={productId:it.productId,batchId:it.batchId,qty:0,refs:[]});row.qty+=Number(it.qty);if(!row.refs.includes(r.ref))row.refs.push(r.ref)})});
  const locs=Object.keys(g);if(!locs.length)return '';
  return `<details class="loadlist"><summary><strong>Loading list</strong> <span class="muted small">what to collect before leaving, by location</span></summary>${locs.map(loc=>`<h3 style="margin:12px 0 6px;font-size:15px">${esc(locName(state,loc)||'Location not chosen')}</h3><div class="tbl"><table><thead><tr><th>Product</th><th>Batch</th><th class="num">Quantity</th><th>Orders</th></tr></thead><tbody>${Object.values(g[loc]).map(x=>`<tr><td><strong>${esc(nm(state.products,x.productId))}</strong></td><td class="code">${esc(batchNo(state,x.batchId))}</td><td class="num"><strong>${x.qty}</strong></td><td class="small">${x.refs.map(esc).join(', ')}</td></tr>`).join('')}</tbody></table></div>`).join('')}</details>`;
}
function stopBody(t,r){
  const T=TYPES[r.type];let where='';
  if(T.customer){const c=find(state.customers,r.customerId)||{};where=`<strong>${esc(custLabel(c))}</strong><br><span class="muted small">${r.govId?esc(govName(r.govId))+', ':''}${esc(c.address||'')}${c.phone?', '+esc(c.phone):''}</span>`}
  else if(r.type==='Transfer')where=`<strong>Transfer to ${esc(locName(state,r.dest))}</strong>${r.govId?`<br><span class="muted small">${esc(govName(r.govId))}</span>`:''}`;
  else where=`<strong>Receive stock</strong>${r.supplier?`<br><span class="muted small">From ${esc(r.supplier)}</span>`:''}`;
  const items=pickTable(r,true);
  return `<div class="row">${refTag(r.ref)}<span class="ty">${esc(r.type)}</span>${st(t.status)}${waitBadge(r)}</div><div style="margin-top:6px">${where}</div>${r.reqDate?`<p class="small" style="margin-top:4px">Requested delivery: ${reqDue(r,true)}</p>`:''}${items}${noteBox(r)}${t.failReason?`<p class="err" style="margin-top:4px">Failed: ${esc(t.failReason)}</p>`:''}`;
}

/* ---------- Delete (administrator only, password confirmed) ---------- */
function deletePlan(s,kind,id){
  if(kind==='warehouse'||kind==='sales'){
    const list=kind==='warehouse'?s.warehouses:s.salesTeam;const x=find(list,id);if(!x)return {blocked:'This record no longer exists.'};
    const loc=(kind==='warehouse'?'W:':'S:')+id;const units=locTotal(s,loc);
    const open=s.requests.filter(r=>!['Completed','Returned to stock'].includes(r.status)&&(r.dest===loc||r.items.some(it=>itemLoc(it)===loc)));
    const label=kind==='warehouse'?'warehouse':'sales team member';
    if(units)return {title:'Delete '+x.name+'?',blocked:`${x.name} still holds ${units} unit${units===1?'':'s'}. Move the stock to another location first (Transfer request), then delete.`};
    if(open.length)return {title:'Delete '+x.name+'?',blocked:`${x.name} is used by ${open.length} open order${open.length===1?'':'s'}: ${open.slice(0,5).map(r=>r.ref).join(', ')}${open.length>5?'…':''}. Finish or delete those orders first.`};
    return {title:'Delete '+x.name+'?',name:x.name,points:[`The ${label} is removed from all lists.`,'Its past stock movements stay in the history, marked "(deleted)".','This cannot be undone.']};
  }
  if(kind==='order'){
    const r=find(s.requests,id);if(!r)return {blocked:'This order no longer exists.'};
    const mv=s.movements.filter(m=>m.ref===r.ref).length,sale=s.sales.some(x=>x.ref===r.ref);
    if(r.status==='Completed'||mv||sale)return {title:'Delete order '+r.ref+'?',blocked:`${r.ref} has already ${sale?'recorded a sale and ':''}moved stock. Deleting it would break the stock and sales records. Create a Return or Cancelled request instead.`};
    const t=taskOf(s,r.ref);const rt=t&&t.routeId?find(s.routes,t.routeId):null;
    return {title:'Delete order '+r.ref+'?',name:r.ref,points:[`${r.type} for ${partyText(s,r)}${r.items.length?', '+itemsText(s,r):''}.`,t?'Its task is deleted'+(rt?' and removed from trip '+rt.name:'')+'.':'It has no task yet.','The deletion is kept in the activity log.','This cannot be undone.']};
  }
  if(kind==='route'){
    const rt=find(s.routes,id);if(!rt)return {blocked:'This trip no longer exists.'};
    const ts=rt.taskIds.map(t=>find(s.tasks,t)).filter(Boolean);const started=ts.filter(t=>t.status!=='Routed');
    if(started.length)return {title:'Delete trip '+rt.name+'?',blocked:`${started.length} stop${started.length===1?' has':'s have'} already been started, completed or failed on this trip (${started.map(t=>t.ref).slice(0,5).join(', ')}). A trip with activity is kept for the record.`};
    return {title:'Delete trip '+rt.name+'?',name:'Trip '+rt.name,points:[ts.length?`Its ${ts.length} order${ts.length===1?'':'s'} (${ts.map(t=>t.ref).slice(0,6).join(', ')}${ts.length>6?'…':''}) ${ts.length===1?'goes':'go'} back to the Routes page, waiting for a new trip.`:'The trip has no stops.','The agent and date are removed from those orders.','This cannot be undone.']};
  }
  if(kind==='agent'){
    const a=find(s.agents,id);if(!a||a.deleted)return {blocked:'This agent no longer exists.'};
    const open=s.tasks.filter(t=>t.agentId===id&&['Routed','In transit'].includes(t.status));
    if(open.length)return {title:'Delete '+a.name+'?',blocked:`${a.name} has ${open.length} open stop${open.length===1?'':'s'} on trips (${open.map(t=>t.ref).slice(0,5).join(', ')}). Finish them, or delete or reassign those trips first.`};
    return {title:'Delete '+a.name+'?',name:a.name,points:['The agent is removed from all lists and cannot be chosen for new trips.','Past trips, deliveries and sales keep the agent\'s name.',a.userId?'Their login is not deleted. Deactivate it on Users and access if needed.':'This cannot be undone.']};
  }
  return {blocked:'Unknown record.'};
}
function applyDelete(s,kind,id){
  if(!isAdmin())throw new Error('Only an administrator can delete.');
  const plan=deletePlan(s,kind,id);if(plan.blocked)throw new Error(plan.blocked);
  s.archive=s.archive||{};
  if(kind==='warehouse'||kind==='sales'){
    const key=kind==='warehouse'?'warehouses':'salesTeam';const x=find(s[key],id);const loc=(kind==='warehouse'?'W:':'S:')+id;
    s.archive[loc]=x.name;s[key]=s[key].filter(y=>y.id!==id);
    for(const k in s.stock)if(k.startsWith(loc+'|')&&!s.stock[k])delete s.stock[k];
    log(s,kind==='warehouse'?'Warehouse deleted':'Sales team member deleted',null,x.name,'Deleted',null,x.projectId);
  }else if(kind==='route'){
    const rt=find(s.routes,id);
    rt.taskIds.forEach(tid=>{const t=find(s.tasks,tid);if(!t)return;t.status='Awaiting route';t.routeId=null;t.agentId='';t.date='';t.routeDate='';const r=find(s.requests,t.requestId);if(r)r.status='Prepared';log(s,'Removed from trip',t.ref,'Trip '+rt.name+' was deleted; waiting for a new trip','Awaiting route',null,r?r.projectId:rt.projectId)});
    s.routes=s.routes.filter(x=>x.id!==id);
    log(s,'Trip deleted',null,rt.name+(rt.note?' ('+rt.note+')':'')+', '+rt.taskIds.length+' stop(s)','Deleted',null,rt.projectId===ALL?null:rt.projectId);
  }else if(kind==='agent'){
    const a=find(s.agents,id);a.deleted=true;a.deletedAt=now();
    log(s,'Logistics agent deleted',null,a.name,'Deleted',null,a.projectId===ALL?null:a.projectId);
  }else{
    const r=find(s.requests,id);const t=taskOf(s,r.ref);
    if(t){if(t.routeId){const rt=find(s.routes,t.routeId);if(rt)rt.taskIds=rt.taskIds.filter(tid=>tid!==t.id)}s.tasks=s.tasks.filter(x=>x.id!==t.id)}
    s.requests=s.requests.filter(x=>x.id!==id);
    log(s,'Order deleted',r.ref,r.type+': '+partyText(s,r)+(r.items.length?', '+itemsText(s,r):'')+'. Status was '+r.status+'.','Deleted',null,r.projectId);
  }
}
async function verifyMyPassword(pw){
  const u=me();if(!u)return false;
  if(FB){try{const cu=FB.auth.currentUser;await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email,pw));return true}catch(e){if(/wrong-password|invalid-credential|invalid-login|user-mismatch/.test(e.code||''))return false;throw e}}
  return (await hashPw(u.username,pw))===u.hash;
}

function countGroups(c){const g={};c.lines.forEach(l=>{(g[l.productId]=g[l.productId]||[]).push(l)});return g}
function countSummary(c){
  const g=countGroups(c);let m=0,mix=0,off=0,re=0;
  Object.values(g).forEach(ls=>{const s=scProductState(ls)[1];if(s==='ok')m++;else if(s==='warn'){if(ls.some(l=>l.reallocated))re++;else mix++}else off++});
  const parts=[];if(m)parts.push(`<span style="color:var(--ok)">${m} match</span>`);if(re)parts.push(`<span style="color:var(--ok)">${re} reallocated</span>`);if(mix)parts.push(`<span style="color:var(--warn)">${mix} batch mix-up</span>`);if(off)parts.push(`<span class="neg">${off} with total variance</span>`);
  return {products:Object.keys(g).length,html:parts.join(', ')};
}
function countDetail(c){
  const g=countGroups(c);let body='';
  Object.entries(g).forEach(([pid,ls])=>{
    const p=find(state.products,pid)||{};const [label,kind]=scProductState(ls);
    const sys=ls.reduce((a,l)=>a+l.system,0),cnt=ls.reduce((a,l)=>a+l.counted,0);
    const done=ls.some(l=>l.reallocated);
    const btn=kind==='warn'?(done?st('Reallocated'):`<button class="btn sm" data-act="scRealloc" data-id="${c.id}" data-p="${pid}">Reallocate batches</button>`):'';
    body+=`<tr class="sc-prod"><td colspan="2"><strong>${esc(p.sku||'')} ${esc(p.name||'')}</strong></td><td class="num"><strong>${sys}</strong></td><td class="num"><strong>${cnt}</strong></td><td class="num">${scVarCell(cnt-sys).h}</td><td><span class="small" style="color:var(--${kind==='ok'?'ok':kind==='warn'?'warn':'bad'});font-weight:700">${esc(label)}</span> ${btn}</td></tr>`+
      ls.map(l=>`<tr><td class="code" style="padding-left:22px">${esc(batchNo(state,l.batchId))}</td><td>${esc(fmtD((find(state.batches,l.batchId)||{}).expiry))}</td><td class="num">${l.system}</td><td class="num">${l.counted}</td><td class="num">${scVarCell(l.counted-l.system).h}</td><td class="small muted">${l.reallocated?'Adjusted to '+l.counted:''}</td></tr>`).join('');
  });
  const tv=c.lines.reduce((a,l)=>a+l.counted-l.system,0);
  const anyMix=Object.entries(g).some(([pid,ls])=>scProductState(ls)[1]==='warn'&&!ls.some(l=>l.reallocated));
  return `<div class="panel">
    <div class="spread" style="margin-bottom:12px"><div class="row"><span class="code" style="font-size:18px">${esc(c.id)}</span>${st(c.status)}<span>${esc(locName(state,c.loc))}</span><span class="muted">${fmtD(c.date)}, by ${esc(c.by)}</span></div><button class="btn plain sm" data-act="scView" data-id="">Back to stock validation</button></div>
    ${c.note?`<p class="muted" style="margin-bottom:10px">${esc(c.note)}</p>`:''}
    <div class="stats"><div class="stat"><b>${Object.keys(g).length}</b><span>Products counted</span></div><div class="stat"><b>${c.lines.filter(l=>l.counted!==l.system).length}</b><span>Batches with variance</span></div><div class="stat"><b style="color:${tv===0?'var(--ok)':'var(--bad)'}">${tv>0?'+':''}${tv}</b><span>Total variance, units</span></div></div>
    <div class="tbl"><table><thead><tr><th>Product / batch</th><th>Expiry</th><th class="num">System</th><th class="num">Counted</th><th class="num">Variance</th><th>Result</th></tr></thead><tbody>${body}</tbody></table></div>
    ${anyMix?`<p class="note" style="margin-top:12px">Reallocating moves units between batches of the same product at ${esc(locName(state,c.loc))} so each batch equals the count. The product total does not change. It is recorded as a Batch reallocation movement under ${esc(c.id)}.</p><div class="row" style="margin-top:10px"><button class="btn" data-act="scRealloc" data-id="${c.id}" data-p="">Reallocate all products whose total matches</button></div>`:''}
    ${Object.values(g).some(ls=>scProductState(ls)[1]==='bad')?`<p class="muted small" style="margin-top:10px">Products marked Short or Over have a different total from the system, so they cannot be reallocated. Investigate the difference first.</p>`:''}
  </div>`;
}
function scLive(form,pid){
  const ins=[...form.querySelectorAll(`input[data-p="${pid}"]`)];const any=ins.some(i=>i.value!=='');
  let tot=0,sys=0,mix=false;
  ins.forEach(i=>{const sy=Number(i.dataset.sys),v=i.value===''?(any?0:null):Math.max(0,Math.floor(Number(i.value)));sys+=sy;const cell=form.querySelector(`[data-bvar="${pid}|${i.name.split('|')[2]}"]`);
    if(v===null){cell.innerHTML='–';return}tot+=v;const d=v-sy;if(d)mix=true;cell.innerHTML=scVarCell(d).h});
  const pt=form.querySelector(`[data-ptot="${pid}"]`),pv=form.querySelector(`[data-pvar="${pid}"]`),ps=form.querySelector(`[data-pstate="${pid}"]`);
  if(!any){pt.textContent='–';pv.innerHTML='–';ps.className='small muted';ps.textContent='Not counted';return}
  const d=tot-sys;pt.textContent=tot;pv.innerHTML=scVarCell(d).h;
  const [lbl,k]=!mix?['Match','ok']:d===0?['Total matches, batches differ','warn']:[d<0?'Short by '+(-d):'Over by '+d,'bad'];
  ps.className='small';ps.style.fontWeight='700';ps.style.color=`var(--${k==='ok'?'ok':k==='warn'?'warn':'bad'})`;ps.textContent=lbl;
}

let toastMsg='';

/* ---------- Agent task actions ---------- */
function completeTask(s,t,r){
  const T=TYPES[r.type];
  if(T.flow==='out'||T.flow==='move')checkStock(s,r);
  const mv=[];
  r.items.forEach(it=>{
    const W=itemLoc(it);const base={ref:r.ref,type:r.type,projectId:r.projectId,productId:it.productId,batchId:it.batchId,qty:it.qty};
    if(T.flow==='out')move(s,{...base,from:W,to:'C:'+r.customerId});
    else if(T.flow==='move')move(s,{...base,from:W,to:r.dest});
    else if(T.flow==='in')move(s,{...base,from:r.type==='Received'?'X:'+(r.supplier||'Supplier'):'C:'+r.customerId,to:W});
    else return;
    const m=s.movements[s.movements.length-1];mv.push(m.qty+' × '+nm(s.products,m.productId)+' batch '+batchNo(s,m.batchId)+' '+locName(s,m.from)+' to '+locName(s,m.to));
  });
  t.status='Completed';t.completedAt=now();r.status='Completed';r.completedAt=now();
  log(s,'Task completed',r.ref,t.id+' by '+nm(s.agents,t.agentId),'Completed',null,r.projectId);
  if(r.type==='Delivery'){
    const lines=r.items.map(it=>{const p=find(s.products,it.productId)||{price:0};return {productId:it.productId,batchId:it.batchId,qty:it.qty,price:p.price,amount:it.qty*p.price}});
    const sale={id:'SAL-'+pad(++s.seq.sale,4),ref:r.ref,projectId:r.projectId,customerId:r.customerId,agentId:t.agentId,date:today(),at:now(),lines,total:lines.reduce((a,l)=>a+l.amount,0),recordedBy:cur()};
    s.sales.push(sale);
    log(s,'Sale recorded',r.ref,sale.id+', '+custLabel(find(s.customers,r.customerId))+', total '+money(sale.total),'Recorded',null,r.projectId);
  }
  if(mv.length)log(s,'Stock updated',r.ref,mv.join('; '),'Completed',null,r.projectId);
  else log(s,'No stock movement',r.ref,'Documentation only','Completed',null,r.projectId);
}

};
function filterRouteTasks(){
  const f=document.querySelector('form[data-form="route"]');if(!f)return;
  const agentId=f.elements.agent.value,gid=f.elements.groupId.value,gov=f.elements.govFilter.value;
  const g=gid?find(state.routeGroups,gid):null;
  const gn=document.getElementById('groupGovs');if(gn){gn.classList.toggle('hide',!g);if(g)gn.textContent='This group covers: '+g.govIds.map(govName).join(', ')+'.'}
  [...f.elements.govFilter.options].forEach(o=>{if(o.value)o.hidden=!!g&&!g.govIds.includes(o.value)});
  if(g&&gov&&!g.govIds.includes(gov))f.elements.govFilter.value='';
  const gv=f.elements.govFilter.value;
  let n=0;document.querySelectorAll('.route-task').forEach(l=>{const on=(!g||g.govIds.includes(l.dataset.gov))&&(!gv||l.dataset.gov===gv);l.classList.toggle('hide',!on);if(!on)l.querySelector('input').checked=false;else n++});
  const e=document.getElementById('noTasksForAgent');if(e)e.classList.toggle('hide',n>0);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.self&&e.target!==el)return;const f=acts[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];if(h)h(new FormData(f),f)});
function applyCustomer(f,c,typed){
  const card=document.getElementById('custCard');
  if(c){f.elements.customerId.value=c.id;if(c.govId)f.elements.govId.value=c.govId;card.innerHTML=custCard(c)}
  else{f.elements.customerId.value='';const n=document.getElementById('reqNew');const open=n&&!n.classList.contains('hide');card.innerHTML=(typed&&!open)?`<div class="row"><span class="err">No customer with ID ${esc(typed)} in this project.</span><button type="button" class="btn ghost sm" data-act="reqNewOpen">Add as new customer</button></div>`:''}
}
function fillReqEdit(){
  const f=document.getElementById('reqForm');const r=state.requests.find(x=>x.id===ui.editReq);if(!f||!r)return;
  f.elements.type.value=r.type;changes.reqType(f.elements.type);
  if(r.customerId){const c=find(state.customers,r.customerId);f.elements.custCode.value=c?(c.code||''):'';f.elements.customerId.value=r.customerId;applyCustomer(f,c,'')}
  f.elements.govId.value=r.govId||'';if(r.dest)f.elements.dest.value=r.dest;if(r.supplier)f.elements.supplier.value=r.supplier;
  f.elements.reqDate.value=r.reqDate||'';f.elements.notes.value=r.notes||'';
  r.items.forEach((it,i)=>{let lines=document.querySelectorAll('#lines .line');if(i>=lines.length){document.getElementById('lines').appendChild(document.getElementById('lineTpl').content.cloneNode(true));lines=document.querySelectorAll('#lines .line')}
    const line=lines[i];const sel=line.querySelector('select[name=item_product]');sel.value=it.productId;changes.lineProduct(sel);
    const bt=line.querySelector('input[name=item_batch]');bt.value=batchNo(state,it.batchId);batchHint(line,r.type);line.querySelector('input[name=item_qty]').value=it.qty});
}
function reqNewToggle(on){const n=document.getElementById('reqNew');if(!n)return;n.classList.toggle('hide',!on);const f=document.getElementById('reqForm');if(on){f.elements.customerId.value='';document.getElementById('custCard').innerHTML='';(f.elements.custCode.value.trim()?f.elements.rnc_name:f.elements.custCode).focus()}}
function soNewToggle(on){const n=document.getElementById('soNew');if(!n)return;n.classList.toggle('hide',!on);const f=document.getElementById('soForm');if(on){f.elements.customerId.value='';document.getElementById('soCard').innerHTML='';(f.elements.soCode.value.trim()?f.elements.nc_name:f.elements.soCode).focus()}}
function soTotal(){const f=document.getElementById('soForm');if(!f)return;let t=0;f.querySelectorAll('.soline').forEach(l=>{t+=(Number(l.querySelector('[name=so_qty]').value)||0)*(Number(l.querySelector('[name=so_price]').value)||0)});document.getElementById('soTotal').textContent='Total '+money(t)}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.inp==='sopcode'){const line=el.closest('.soline');const sel=line.querySelector('[name=so_product]');const p=prodByCode(el.value);
    sel.value=p?p.id:'';sel.dataset.fromCode='1';changes.soProduct(sel);delete sel.dataset.fromCode;
    if(!p){const h=line.querySelector('.sohint');h.style.color=el.value.trim()?'var(--bad)':'';h.textContent=el.value.trim()?'No product with this ID':''}return}if(el.dataset&&el.dataset.inp==='opcode'){const f=el.form,sel=f.elements.product,h=f.querySelector('.ophint');const p=prodByCode(el.value);
    sel.value=p?p.id:'';sel.dataset.fromCode='1';changes.lineProduct(sel);delete sel.dataset.fromCode;
    h.className='ophint small';if(p){h.style.color='var(--ok)';h.textContent=p.sku+', '+p.name}else{h.style.color=el.value.trim()?'var(--bad)':'';h.textContent=el.value.trim()?'No product with this ID':''}return}if(el.dataset&&el.dataset.inp==='pcode'){const line=el.closest('.line');const sel=line.querySelector('select[name=item_product]');const h=line.querySelector('.phint');const p=prodByCode(el.value);
    if(p){if(sel.value!==p.id){sel.value=p.id;const keep=el.value;changes.lineProduct(sel);el.value=keep}h.className='phint small';h.style.color='var(--ok)';h.textContent=p.sku+', '+p.name}
    else{const keep=el.value;if(sel.value){sel.value='';changes.lineProduct(sel);el.value=keep}h.className='phint small';h.style.color=keep.trim()?'var(--bad)':'';h.textContent=keep.trim()?'No product with this ID':''}return}if(el.dataset&&el.dataset.inp==='soCalc'){soTotal();return}if(el.dataset&&el.dataset.inp==='soCust'){const c=custByCode(el.value);const f=el.form;if(c){f.elements.customerId.value=c.id;if(c.govId)f.elements.govId.value=c.govId;document.getElementById('soCard').innerHTML=custCard(c)}else{f.elements.customerId.value='';const isNew=!document.getElementById('soNew').classList.contains('hide');document.getElementById('soCard').innerHTML=(el.value.trim()&&!isNew)?`<div class="row"><span class="err">No customer with ID ${esc(el.value.trim())}.</span><button type="button" class="btn ghost sm" data-act="soNewOpen">Add as new customer</button></div>`:''}return}
  if(el.dataset&&el.dataset.inp==='soCust')return;if(el.dataset&&el.dataset.inp==='count'){scLive(el.form,el.dataset.p);return}if(el.dataset&&el.dataset.inp==='custId'){const t=el.value.trim();applyCustomer(el.form,custByCode(t),t);return}if(el.dataset&&el.dataset.inp==='batchFind'){const line=el.closest('.line');batchHint(line,el.form.elements.type.value)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const h=changes[el.dataset.chg];if(h)h(el)});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(ui.pending){const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))softRender()}},200)});
new MutationObserver(()=>{const s=document.querySelector('select[data-chg="routeAgent"]');if(s&&!s.dataset.init){s.dataset.init='1';filterRouteTasks()}}).observe(document.getElementById('app'),{childList:true,subtree:true});

window.addEventListener('error',e=>{try{toast('Unexpected error: '+(e.message||'unknown'),'bad')}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{toast('Unexpected error: '+((e.reason&&e.reason.message)||e.reason||'unknown'),'bad')}catch(x){}});
/* ---------- Boot ---------- */
async function boot(){
  if(FIREBASE_CONFIG){if(window.firebase&&firebase.initializeApp){try{fbBoot()}catch(e){document.getElementById('app').innerHTML='<div class="login"><div class="login-card"><h2>Setup problem</h2><p class="muted">'+esc(e.message||e)+'</p></div></div>'}}else{document.getElementById('app').innerHTML='<div class="login"><div class="login-card"><h2>Cannot reach the database</h2><p class="muted">The Firebase library did not load. Check your internet connection and reload the page.</p></div></div>'}return}
  render();
  let loaded=null;try{loaded=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  state=(loaded&&(loaded.v===1||loaded.v===2)&&loaded.users&&(loaded.users.length||!LIVE_MODE))?migrate(loaded):(LIVE_MODE?await liveStart():await seedState());
  lastJson=JSON.stringify(state);
  try{session=JSON.parse(sessionStorage.getItem(SS_KEY)||'null')}catch(e){session=null}
  render();
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const db=await window.claude.use('db');
      if(db){
        docRef=db.doc('app/state');
        docRef.onSnapshot(snap=>{
          if(!snap.exists){persist();return}
          const d=snap.data();if(!d||typeof d.json!=='string'||d.json===lastJson)return;
          try{const r=JSON.parse(d.json);if(!r||(r.v!==1&&r.v!==2))return;const was=r.v,hadG=!!r.govs;state=migrate(r);lastJson=d.json;if(was===1||!hadG){persist()}try{localStorage.setItem(LS_KEY,d.json)}catch(e){}softRender()}catch(e){}
        },err=>{toast('Shared storage is unavailable. Changes are saved in this browser only.','bad')});
      }
    }
  }catch(e){}
}
boot();
</script>
